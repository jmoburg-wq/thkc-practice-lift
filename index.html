    if (!pts) return;

    });
  }

  function optById(q, id) {
    if (!q || !q.options) return null;
    for (var i = 0; i < q.options.length; i++) if (q.options[i].id === id) return q.options[i];
    return null;
  }

  function qById(id) {
    for (var i = 0; i < QUESTIONS.length; i++) if (QUESTIONS[i].id === id) return QUESTIONS[i];
    return null;
  }

  function protectTaken(upToRank) {
    var taken = {};
    ["q2a", "q2b", "q2c"].forEach(function (id, i) {
      var rank = i + 1;
      if (rank <= upToRank && state.answers[id]) taken[state.answers[id]] = true;
    });
    return taken;
  }

  function protectOpts(rank) {
    var taken = protectTaken(rank - 1);
    return PROTECT.filter(function (p) { return !taken[p.id]; });
  }

  function scoreAll() {
    var scores = { CASH: 0, BOTTLE: 0, OFFER: 0, CONTENT: 0, FULFILL: 0, CONTROL: 0 };
    var will = 0;
    var managedSignal = false;
    var managedWeight = 0;
    var recorderNamed = false;
    var preferenceNoOutbound = false;

    QUESTIONS.forEach(function (q) {
      if (q.kind === "protect") return;
      var pick = optById(q, state.answers[q.id]);
      if (!pick) return;
      addPts(scores, pick.pts);
      if (typeof pick.will === "number") will = pick.will;
      if (pick.managedSignal) managedSignal = true;
      if (pick.managed) managedWeight = pick.managed;
      if (q.id === "q14" && pick.named) recorderNamed = true;
      if (q.id === "q16" && pick.preference) preferenceNoOutbound = true;
    });

    var rankPts = { q2a: 3, q2b: 2, q2c: 1 };
    var protectRanks = {};
    ["q2a", "q2b", "q2c"].forEach(function (id) {
      var pid = state.answers[id];
      if (!pid) return;
      var row = PROTECT.filter(function (p) { return p.id === pid; })[0];
      if (!row) return;
      scores[row.bucket] += rankPts[id];
      protectRanks[pid] = id === "q2a" ? 1 : id === "q2b" ? 2 : 3;
    });

    if (state.answers.q3 && state.answers.q4 && state.answers.q3 !== state.answers.q4) {
      scores.OFFER += 1;
    }

    if (state.answers.q7 === "E") {
      var fulfillRank = protectRanks.fulfill || 99;
      scores.FULFILL += (fulfillRank <= 2) ? 2 : 0;
    }

    var q11 = state.answers.q11;
    var q14 = state.answers.q14;
    var q18 = state.answers.q18;
    var load = scores.BOTTLE + scores.CONTROL;
    if (q18 === "C" || q18 === "D" || q18 === "E") load += 3;
    if (q14 === "C" || q14 === "D") load += 2;
    if (q11 === "D" || q11 === "E") load += 2;

    var lean = "BOTH";
    if (load >= 8 || q18 === "C" || q18 === "D") lean = "MANAGED";
    else if (will >= 2 && load <= 5 && recorderNamed) lean = "DIY";

    var ranked = BUCKETS.slice().sort(function (a, b) {
      if (scores[b] !== scores[a]) return scores[b] - scores[a];
      return BUCKETS.indexOf(a) - BUCKETS.indexOf(b);
    });
    var hot = ranked[0];
    var second = ranked[1] && scores[ranked[1]] > 0 ? ranked[1] : null;
    var ties = ranked.filter(function (k) { return scores[k] === scores[hot] && scores[k] > 0; });

    return {
      scores: scores,
      will: will,
      managedSignal: managedSignal,
      managedWeight: managedWeight,
      recorderNamed: recorderNamed,
      preferenceNoOutbound: preferenceNoOutbound,
      load: load,
      lean: lean,
      hot: hot,
      second: second,
      ties: ties,
      bands: BUCKETS.reduce(function (acc, k) { acc[k] = band(scores[k]); return acc; }, {})
    };
  }

  function esc(s) {

    s = s || "";

  function goNext() {
    if (state.view === "intro") {
      state.view = "q";
      state.qi = 0;

      return;

      return;

    state.qi += 1;

  function goBack() {
    if (state.view === "end") {
      state.view = "q";
      state.qi = QUESTIONS.length - 1;
      state.copied = false;
      state.sent = false;
      draw();
      return;
    }
    if (state.view === "q" && state.qi === 0) {

      return;
    }

        if (q.rank === 2) {
          if (state.answers.q2c === val) delete state.answers.q2c;
        }
      }
    } else {
      state.answers[id] = val;
    }

  }

            s.className = "copied";
            s.textContent = "Copied";
            row.appendChild(s);
          }
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text); done(); });
        } else {
          fallbackCopy(text);
          done();
        }
      });
    }
  }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  window.__pcdScore = scoreAll;
  window.__pcdState = state;
  window.__pcdQuestions = QUESTIONS;

  var locked = qsWho();
  if (locked) {
    state.who = locked;
    state.view = "intro";
  } else {
    state.view = "who";
  }
  draw();
})();
</script>
